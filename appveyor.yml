version: 2.0.0-beta.1.{build}

branches:
  only:
    - main
    - master
    - dev
  except:
    - gh-pages

max_jobs: 1
clone_depth: 20
image: Visual Studio 2022

environment:
  VSMR_RELEASE_VERSION: 2.0.0-beta.1

configuration: Release
platform: Win32

install:
  - cmd: where msbuild
  - cmd: msbuild /version
  - ps: Write-Host "PowerShell $($PSVersionTable.PSVersion) on $([Environment]::OSVersion.VersionString)"

before_build:
  - ps: >-
      & "$env:APPVEYOR_BUILD_FOLDER\vSMR\tools\normalize_runtime_data.ps1"
      -Mode Check
      -DataDirectory "$env:APPVEYOR_BUILD_FOLDER\vSMR\data"

build_script:
  - cmd: >-
      msbuild "%APPVEYOR_BUILD_FOLDER%\vSMR.sln"
      /t:Restore
      /p:Configuration=Release
      /p:Platform=Win32
      /p:PlatformToolset=v143
      /verbosity:minimal
  - cmd: >-
      msbuild "%APPVEYOR_BUILD_FOLDER%\vSMR.sln"
      /t:Rebuild
      /m
      /p:Configuration=Release
      /p:Platform=Win32
      /p:PlatformToolset=v143
      /p:ContinuousIntegrationBuild=true
      /logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll"

after_build:
  - ps: >-
      $isPullRequest = -not [string]::IsNullOrWhiteSpace($env:APPVEYOR_PULL_REQUEST_NUMBER);
      & "$env:APPVEYOR_BUILD_FOLDER\vSMR\tools\package_release.ps1"
      -RepositoryRoot $env:APPVEYOR_BUILD_FOLDER
      -BuildOutputDirectory "$env:APPVEYOR_BUILD_FOLDER\Release"
      -ArtifactsDirectory "$env:APPVEYOR_BUILD_FOLDER\artifacts"
      -Version $env:VSMR_RELEASE_VERSION
      -Configuration Release
      -Platform Win32
      -Toolset v143
      -PdbPath "$env:APPVEYOR_BUILD_FOLDER\vSMR\Release\vSMR.pdb"
      -SkipBuild
      -ForceNonPublishable:$isPullRequest
  - ps: >-
      $isPullRequest = -not [string]::IsNullOrWhiteSpace($env:APPVEYOR_PULL_REQUEST_NUMBER);
      & "$env:APPVEYOR_BUILD_FOLDER\vSMR\tools\verify_release_package.ps1"
      -ArchivePath "$env:APPVEYOR_BUILD_FOLDER\artifacts\vSMR-$($env:VSMR_RELEASE_VERSION).zip"
      -ExpectedVersion $env:VSMR_RELEASE_VERSION
      -AllowNonPublishable:$isPullRequest
  - ps: >-
      if (-not [string]::IsNullOrWhiteSpace($env:APPVEYOR_PULL_REQUEST_NUMBER)) {
        $base = "vSMR-$($env:VSMR_RELEASE_VERSION)";
        $validationBase = "$base-pr-$($env:APPVEYOR_PULL_REQUEST_NUMBER)-validation-only";
        $artifactRoot = "$env:APPVEYOR_BUILD_FOLDER\artifacts";
        Move-Item -LiteralPath "$artifactRoot\$base.zip" -Destination "$artifactRoot\$validationBase.zip";
        Move-Item -LiteralPath "$artifactRoot\$base-symbols.zip" -Destination "$artifactRoot\$validationBase-symbols.zip";
        $hash = (Get-FileHash -LiteralPath "$artifactRoot\$validationBase.zip" -Algorithm SHA256).Hash.ToLowerInvariant();
        [System.IO.File]::WriteAllText(
          "$artifactRoot\$validationBase.zip.sha256",
          "$hash  $validationBase.zip`n",
          (New-Object System.Text.UTF8Encoding($false))
        );
        Remove-Item -LiteralPath "$artifactRoot\$base.zip.sha256" -Force;
      }

test: off

artifacts:
  - path: artifacts\vSMR-2.0.0-beta.1.zip
    name: vSMR-2.0.0-beta.1
  - path: artifacts\vSMR-2.0.0-beta.1.zip.sha256
    name: vSMR-2.0.0-beta.1-sha256
  - path: artifacts\vSMR-2.0.0-beta.1-symbols.zip
    name: vSMR-2.0.0-beta.1-private-symbols
  - path: artifacts\vSMR-2.0.0-beta.1-pr-*-validation-only.zip
    name: vSMR-pr-validation-only
  - path: artifacts\vSMR-2.0.0-beta.1-pr-*-validation-only.zip.sha256
    name: vSMR-pr-validation-only-sha256
  - path: artifacts\vSMR-2.0.0-beta.1-pr-*-validation-only-symbols.zip
    name: vSMR-pr-validation-only-private-symbols
