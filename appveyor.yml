version: 2.0.0-beta.4.{build}

branches:
  only:
    - main
    - master
    - dev
    - /^v?2[.]0[.]0-beta[.]4$/
  except:
    - gh-pages

max_jobs: 1
clone_depth: 20
image: Visual Studio 2022

environment:
  VSMR_RELEASE_VERSION: 2.0.0-beta.4

configuration: Release
platform: Win32

install:
  - cmd: where msbuild
  - cmd: msbuild /version
  - ps: Write-Host "PowerShell $($PSVersionTable.PSVersion) on $([Environment]::OSVersion.VersionString)"

before_build:
  - ps: >-
      $isExpectedReleaseTag = $env:APPVEYOR_REPO_TAG -eq 'true' -and
        $env:APPVEYOR_REPO_TAG_NAME -in @($env:VSMR_RELEASE_VERSION, "v$($env:VSMR_RELEASE_VERSION)");
      $isProtectedBranchCommit = $false;
      if ($isExpectedReleaseTag) {
        $releaseCommit = ([string](& git.exe -C $env:APPVEYOR_BUILD_FOLDER rev-parse HEAD)).Trim();
        if ($LASTEXITCODE -ne 0 -or $releaseCommit -notmatch '^[0-9a-fA-F]{40}$') {
          throw 'The tagged release commit could not be resolved.';
        };
        foreach ($releaseBranch in @('main', 'master')) {
          & git.exe -C $env:APPVEYOR_BUILD_FOLDER fetch --no-tags --depth=1000 origin "+refs/heads/$releaseBranch`:refs/remotes/origin/$releaseBranch" 2>$null;
          if ($LASTEXITCODE -ne 0) { continue };
          & git.exe -C $env:APPVEYOR_BUILD_FOLDER merge-base --is-ancestor $releaseCommit "refs/remotes/origin/$releaseBranch";
          if ($LASTEXITCODE -eq 0) { $isProtectedBranchCommit = $true; break };
        };
      };
      if ($isExpectedReleaseTag -and -not $isProtectedBranchCommit) {
        throw 'Publishable release tags must identify a commit contained in remote main or master.';
      };
      $isReleaseTag = $isExpectedReleaseTag -and $isProtectedBranchCommit;
      $hasSigningMaterial = -not [string]::IsNullOrWhiteSpace($env:VSMR_SIGNING_CERT_THUMBPRINT) -and
        -not [string]::IsNullOrWhiteSpace($env:VSMR_UPDATE_SIGNER_CERT_SHA256);
      if ($isReleaseTag -and -not $hasSigningMaterial) {
        throw "Release tag $($env:APPVEYOR_REPO_TAG_NAME) requires VSMR_SIGNING_CERT_THUMBPRINT and VSMR_UPDATE_SIGNER_CERT_SHA256.";
      }
      Set-AppveyorBuildVariable -Name VSMR_CI_PUBLISHABLE_RELEASE -Value $(if ($isReleaseTag) { '1' } else { '0' })
  - ps: >-
      if (-not [string]::IsNullOrWhiteSpace($env:VSMR_UPDATE_SIGNER_CERT_SHA256)) {
        $env:VsmrUpdateSignerCertSha256 = $env:VSMR_UPDATE_SIGNER_CERT_SHA256.ToLowerInvariant()
      }
  - ps: >-
      & "$env:APPVEYOR_BUILD_FOLDER\vSMR\tools\normalize_runtime_data.ps1"
      -Mode Check
      -DataDirectory "$env:APPVEYOR_BUILD_FOLDER\vSMR\data"

build_script:
  - cmd: >-
      msbuild "%APPVEYOR_BUILD_FOLDER%\vSMR.sln"
      /t:Restore
      /p:Configuration=Release
      /p:Platform=Win32
      /p:PlatformToolset=v143
      /p:VsmrUpdateSignerCertSha256=%VSMR_UPDATE_SIGNER_CERT_SHA256%
      /nodeReuse:false
      /verbosity:minimal
  - cmd: >-
      msbuild "%APPVEYOR_BUILD_FOLDER%\vSMR.sln"
      /t:Rebuild
      /m
      /p:Configuration=Release
      /p:Platform=Win32
      /p:PlatformToolset=v143
      /p:ContinuousIntegrationBuild=true
      /p:VsmrUpdateSignerCertSha256=%VSMR_UPDATE_SIGNER_CERT_SHA256%
      /nodeReuse:false
      /logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll"

after_build:
  - ps: >-
      & "$env:APPVEYOR_BUILD_FOLDER\vSMR\tools\crash_harness\run_crash_harness.ps1"
      -RepositoryRoot $env:APPVEYOR_BUILD_FOLDER
      -Configuration Release
      -Toolset v143
      -SkipProductionHandlerBuild
  - ps: >-
      & "$env:APPVEYOR_BUILD_FOLDER\vSMR\tools\updater_harness\run_updater_harness.ps1"
      -MSBuildPath (Get-Command msbuild.exe).Source
      -Toolset v143
  - ps: >-
      $validationOnly = $env:VSMR_CI_PUBLISHABLE_RELEASE -ne '1';
      & "$env:APPVEYOR_BUILD_FOLDER\vSMR\tools\package_release.ps1"
      -RepositoryRoot $env:APPVEYOR_BUILD_FOLDER
      -BuildOutputDirectory "$env:APPVEYOR_BUILD_FOLDER\Release"
      -ArtifactsDirectory "$env:APPVEYOR_BUILD_FOLDER\artifacts"
      -Version $env:VSMR_RELEASE_VERSION
      -Configuration Release
      -Platform Win32
      -Toolset v143
      -PdbPath "$env:APPVEYOR_BUILD_FOLDER\vSMR\obj\Release\Runtime\vSMR.Runtime.pdb"
      -LoaderPdbPath "$env:APPVEYOR_BUILD_FOLDER\vSMR\src\bootstrap\loader\obj\Release\vSMR.pdb"
      -CrashHandlerPdbPath "$env:APPVEYOR_BUILD_FOLDER\vSMR\src\crash\handler\obj\Release\vSMRCrashHandler.pdb"
      -UpdateSignerCertSha256 ([string]$env:VSMR_UPDATE_SIGNER_CERT_SHA256)
      -SkipBuild
      -RequireSignature:(-not $validationOnly)
      -ForceNonPublishable:$validationOnly
  - ps: >-
      $validationOnly = $env:VSMR_CI_PUBLISHABLE_RELEASE -ne '1';
      $verifyArguments = @{
        ArchivePath = "$env:APPVEYOR_BUILD_FOLDER\artifacts\vSMR-$($env:VSMR_RELEASE_VERSION).zip";
        ExpectedVersion = $env:VSMR_RELEASE_VERSION;
        ExpectedLoaderVersion = '1.1.0';
        ExpectedRuntimeAbi = 1;
        RequireSignature = -not $validationOnly;
        AllowNonPublishable = $validationOnly
      };
      if (-not $validationOnly) {
        $beta3Fixture = "$env:APPVEYOR_BUILD_FOLDER\artifacts\vSMR-2.0.0-beta.3.published-fixture.zip";
        Invoke-WebRequest -Uri 'https://github.com/IWantPizzaa/vSMR/releases/download/2.0.0-beta.3/vSMR-2.0.0-beta.3.zip' -OutFile $beta3Fixture -UseBasicParsing;
        $verifyArguments.PublishedBeta3ArchivePath = $beta3Fixture;
        $verifyArguments.RequirePublishedBeta3Migration = $true
      };
      & "$env:APPVEYOR_BUILD_FOLDER\vSMR\tools\verify_release_package.ps1" @verifyArguments
  - ps: >-
      if ($env:VSMR_CI_PUBLISHABLE_RELEASE -ne '1') {
        $base = "vSMR-$($env:VSMR_RELEASE_VERSION)";
        $buildLabel = if (-not [string]::IsNullOrWhiteSpace($env:APPVEYOR_PULL_REQUEST_NUMBER)) {
          "pr-$($env:APPVEYOR_PULL_REQUEST_NUMBER)"
        } else {
          (($env:APPVEYOR_REPO_BRANCH -replace '[^A-Za-z0-9_.-]', '-') + "-$($env:APPVEYOR_BUILD_NUMBER)")
        };
        $validationBase = "$base-$buildLabel-validation-only";
        $artifactRoot = "$env:APPVEYOR_BUILD_FOLDER\artifacts";
        Move-Item -LiteralPath "$artifactRoot\$base.zip" -Destination "$artifactRoot\$validationBase.zip";
        Move-Item -LiteralPath "$artifactRoot\$base-symbols.zip" -Destination "$artifactRoot\$validationBase-symbols.zip";
        Remove-Item -LiteralPath "$artifactRoot\$base.update.json" -Force -ErrorAction SilentlyContinue;
        Remove-Item -LiteralPath "$artifactRoot\$base.update.json.p7s" -Force -ErrorAction SilentlyContinue;
      }
  - ps: >-
      $signaturePath = "$env:APPVEYOR_BUILD_FOLDER\artifacts\vSMR-$($env:VSMR_RELEASE_VERSION).update.json.p7s";
      if (Test-Path -LiteralPath $signaturePath -PathType Leaf) {
        Push-AppveyorArtifact $signaturePath -FileName ([System.IO.Path]::GetFileName($signaturePath)) -DeploymentName "vSMR update signature";
      }

test: off

artifacts:
  - path: artifacts\vSMR-2.0.0-beta.4.zip
    name: vSMR-2.0.0-beta.4
  - path: artifacts\vSMR-2.0.0-beta.4.update.json
    name: vSMR-2.0.0-beta.4-update-manifest
  - path: artifacts\vSMR-2.0.0-beta.4-*-validation-only.zip
    name: vSMR-validation-only
