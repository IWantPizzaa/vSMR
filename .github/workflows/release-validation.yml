name: Release validation

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  VSMR_RELEASE_VERSION: 2.0.0-beta.1

jobs:
  win32-release:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Verify Visual C++ x86 MFC workload
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (-not $installation) { throw "The Windows runner is missing the Visual C++ ATL/MFC component." }
          $afx = Get-ChildItem -Path "$installation\VC\Tools\MSVC\*\atlmfc\include\afxwin.h" -File
          if (-not $afx) { throw "The Windows runner has no x86 MFC headers." }

      - name: Validate source and runtime data
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File vSMR\tools\normalize_runtime_data.ps1
          -Mode Check
          -DataDirectory "%GITHUB_WORKSPACE%\vSMR\data"

      - name: Restore native packages
        shell: cmd
        run: >-
          msbuild "%GITHUB_WORKSPACE%\vSMR.sln"
          /t:Restore
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /verbosity:minimal

      - name: Rebuild Release Win32
        shell: cmd
        run: >-
          msbuild "%GITHUB_WORKSPACE%\vSMR.sln"
          /t:Rebuild
          /m
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:ContinuousIntegrationBuild=true

      - name: Validate and build clean versioned artifacts
        env:
          VSMR_FORCE_NONPUBLISHABLE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File vSMR\tools\package_release.ps1
          -RepositoryRoot "%GITHUB_WORKSPACE%"
          -BuildOutputDirectory "%GITHUB_WORKSPACE%\Release"
          -ArtifactsDirectory "%GITHUB_WORKSPACE%\artifacts"
          -Version "%VSMR_RELEASE_VERSION%"
          -Configuration Release
          -Platform Win32
          -Toolset v143
          -PdbPath "%GITHUB_WORKSPACE%\vSMR\Release\vSMR.pdb"
          -SkipBuild

      - name: Verify release archive and manifests
        env:
          VSMR_ALLOW_NONPUBLISHABLE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File vSMR\tools\verify_release_package.ps1
          -ArchivePath "%GITHUB_WORKSPACE%\artifacts\vSMR-%VSMR_RELEASE_VERSION%.zip"
          -ExpectedVersion "%VSMR_RELEASE_VERSION%"

      - name: Upload user release candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vSMR-${{ env.VSMR_RELEASE_VERSION }}-win32
          if-no-files-found: error
          path: |
            artifacts/vSMR-${{ env.VSMR_RELEASE_VERSION }}.zip
            artifacts/vSMR-${{ env.VSMR_RELEASE_VERSION }}.zip.sha256

      - name: Upload private debug symbols
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vSMR-${{ env.VSMR_RELEASE_VERSION }}-private-symbols
          if-no-files-found: error
          retention-days: 14
          path: artifacts/vSMR-${{ env.VSMR_RELEASE_VERSION }}-symbols.zip

      - name: Upload non-publishable PR validation artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vSMR-${{ env.VSMR_RELEASE_VERSION }}-pr-${{ github.event.pull_request.number }}-validation-only
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/vSMR-${{ env.VSMR_RELEASE_VERSION }}.zip
            artifacts/vSMR-${{ env.VSMR_RELEASE_VERSION }}.zip.sha256
